name: Codex on Windows

on:
  pull_request:
    paths:
      - 'src/server/**'
      - 'src/shared/**'
      - 'tests/codex*.test.ts'
      - 'tests/worker-input.test.ts'
      - 'package*.json'
      - '.github/workflows/codex-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codex-hooks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      # Runs the generated commands through Windows PowerShell and a local authenticated bridge.
      # The Codex CLI and API credentials are not needed.
      - run: node --import tsx --test tests/codex.test.ts tests/codex-usage.test.ts tests/codex-hook-shell.test.ts tests/codex-hook-transport.test.ts tests/worker-input.test.ts
